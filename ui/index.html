<!doctype html>
<html lang="en" data-theme="claw" data-theme-mode="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0e1015" />
<meta name="color-scheme" content="dark light" />
<title>SuparClaw</title>
<!--
  Design tokens follow OpenClaw's Control UI stylesheet
  (ui/src/styles/base.css, MIT licensed, Copyright OpenClaw contributors):
  same surfaces, signature accent, type scale, spacing, radii and shadows.
  SuparClaw reuses the tokens and writes its own, much smaller app on top.
-->
<link rel="stylesheet" href="./styles.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='10' fill='%23ff5c5c'/%3E%3C/svg%3E" />
</head>
<body>
<div id="app">
  <header class="rail">
    <button class="icon-btn only-mobile" id="drawer-btn" title="Sessions" aria-label="Sessions">☰</button>
    <div class="brand"><span class="dot" id="brand-dot"></span> SuparClaw</div>
    <button class="pill session-pill" id="session-pill" title="Current session">main:main</button>
    <div class="spacer"></div>
    <button class="pill model-pill" id="model-pill" title="Choose model (⌘L)">model…</button>
    <span class="pill state-pill" id="conn-pill">connecting…</span>
    <button class="icon-btn" id="settings-btn" title="Settings" aria-label="Settings">⚙</button>
    <button class="icon-btn" id="theme-btn" title="Toggle theme" aria-label="Toggle theme">◐</button>
  </header>

  <aside id="sidebar">
    <div class="side-head">
      <span class="side-title">Sessions</span>
      <button class="icon-btn" id="new-session" title="New session">＋</button>
    </div>
    <div id="sessions" class="sessions"></div>
    <div id="stats" class="stats"></div>
  </aside>

  <main id="main">
    <section id="chat-view" class="view">
      <div id="thread" class="thread">
        <div class="empty" id="empty-state">
          <div class="empty-title">No messages yet</div>
          <div class="empty-sub">Ask anything — it can read your workspace and run tools.</div>
          <div class="suggestions" id="suggestions"></div>
        </div>
      </div>
      <button id="jump" class="jump" hidden>↓ latest</button>
      <footer id="composer" class="composer">
        <div class="composer-inner">
          <div class="approval-bar" id="approval-bar" hidden></div>
          <div class="composer-box">
            <textarea id="input" rows="1" placeholder="Message SuparClaw…" spellcheck="false"></textarea>
            <div class="composer-actions">
              <span class="hint" id="hint">Enter send · Shift+Enter newline · Esc stop</span>
              <span class="hint" id="tok"></span>
              <button class="btn stop" id="stop-btn" hidden>■ Stop</button>
              <button class="btn primary send" id="send-btn" disabled>Send</button>
            </div>
          </div>
        </div>
      </footer>
    </section>

    <section id="settings-view" class="view" hidden></section>
  </main>
</div>

<div id="backdrop" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div id="toasts"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
