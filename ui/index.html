<!doctype html>
<html lang="en" data-theme-mode="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#F4F3EF" />
<title>SuparClaw</title>
<link rel="stylesheet" href="./styles.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232B50F0'/%3E%3Cpath d='M8 20l4-10 4 6 4-6 4 10' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<style>
  /* First paint before styles.css arrives: never flash the wrong theme. */
  html { background: #F4F3EF; }
  html[data-theme-mode="dark"] { background: #0E0E11; }
  html, body { height: 100%; }
  body { margin: 0; }
</style>
</head>
<body>
<div class="app" id="app">

  <!-- Top rail: sessions, connection, settings, theme (chat chrome — hidden on Settings) -->
  <header class="rail" id="rail">
    <button class="ibtn" id="drawer-btn" type="button" aria-label="Sessions" aria-expanded="false">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <button class="rail-session" id="session-btn" type="button">
      <span class="rail-session__title" id="session-title">main:main</span>
      <span class="rail-session__status">
        <span class="dot" id="conn-dot" aria-hidden="true"></span>
        <span id="conn-label">connecting…</span>
      </span>
    </button>
    <button class="ibtn" id="new-chat-btn" type="button" aria-label="New chat">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="ibtn" id="subagents-btn" type="button" aria-label="Sub-agents">
      <svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    </button>
    <button class="ibtn" id="settings-btn" type="button" aria-label="Settings">
      <svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/></svg>
    </button>
    <button class="ibtn" id="theme-btn" type="button" aria-label="Toggle theme">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></svg>
    </button>
  </header>

  <!-- Chat -->
  <section class="view view--chat" id="chat-view">
    <div class="scroll" id="thread">
      <div class="stack" id="stack"></div>
    </div>

    <div class="dock">
      <div class="dock__fade" aria-hidden="true"></div>
      <button class="jump" id="jump" type="button" hidden>
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
        Jump to latest
      </button>

      <div class="qrow" id="qrow" hidden></div>

      <div class="approval" id="approval" role="alert" hidden>
        <div class="approval__head">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z"/></svg>
          <span><b id="approval-tool">run_command</b> <span class="approval__what">wants to run</span></span>
        </div>
        <code class="mono approval__args" id="approval-args"></code>
        <div class="approval__why" id="approval-why"></div>
        <div class="approval__row">
          <button class="btn" id="approval-deny" type="button">Deny</button>
          <button class="btn" id="approval-always" type="button">Always allow</button>
          <button class="btn pri" id="approval-allow" type="button">Approve once</button>
        </div>
      </div>

      <div class="approval" id="question" role="alert" hidden>
        <div class="approval__head">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 .3c0 1.7-2.5 2-2.5 3.7"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          <span><b>The agent is asking</b> <span class="approval__what">— answer to continue</span></span>
        </div>
        <div id="question-body"></div>
        <div class="approval__row">
          <button class="btn" id="question-skip" type="button">Skip</button>
          <button class="btn pri" id="question-answer" type="button">Answer</button>
        </div>
      </div>

      <div class="composer" id="composer">
        <div class="attach-strip" id="attach-strip" hidden></div>
        <textarea id="input" rows="1" placeholder="Message the agent…" aria-label="Message"></textarea>
        <div class="composer__row">
          <button class="attach-btn" id="attach-btn" type="button" aria-label="Attach files" title="Attach files (or drop / paste)">
            <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.4 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 1 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <input id="attach-input" type="file" multiple hidden />
          <div class="model-wrap" id="model-wrap">
            <button class="model-btn" id="model-btn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Choose model" title="Choose model">
              <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z"/></svg>
              <span class="mono" id="model-name" hidden>model…</span>
              <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>
            </button>
            <div class="model-menu" id="model-menu" hidden>
              <input class="model-menu__filter" id="model-filter" type="search" placeholder="Search models…" aria-label="Search models" />
              <div class="model-menu__list" id="model-list"></div>
              <button class="model-menu__add" id="model-add" type="button">+ Add provider…</button>
            </div>
          </div>
          <div class="think" id="think-wrap" title="Thinking effort (session)">
            <button class="think__btn" id="think-btn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Thinking effort">
              <svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a5 5 0 0 1 5 5c0 1.5-.7 2.6-1.5 3.5-.6.7-1 1.3-1 2.5v1a3 3 0 0 1-3 3h-1"/><path d="M12 3a5 5 0 0 0-5 5c0 1.5.7 2.6 1.5 3.5.6.7 1 1.3 1 2.5v1a3 3 0 0 0 3 3h1"/><path d="M9 21h6"/></svg>
              <span class="think__value mono" id="think-value">auto</span>
              <svg class="think__chev" aria-hidden="true" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <div class="think__menu" id="think-menu" role="listbox" hidden></div>
            <select id="think" class="think__select" aria-label="Thinking effort" hidden>
              <option value="inherit">auto</option>
            </select>
          </div>
          <div class="think" id="queue-wrap" title="Queue mode (session): what a new message does while this session is busy">
            <button class="think__btn" id="queue-btn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Queue mode">
              <svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
              <span class="think__value mono" id="queue-value">queue</span>
              <svg class="think__chev" aria-hidden="true" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <div class="think__menu" id="queue-menu" role="listbox" hidden></div>
            <select id="queue-select" class="think__select" aria-label="Queue mode" hidden>
              <option value="inherit">queue</option>
              <option value="steer">steer</option>
              <option value="followup">followup</option>
              <option value="collect">collect</option>
              <option value="interrupt">interrupt</option>
            </select>
            <span class="queue-depth" id="queue-depth" hidden></span>
          </div>
          <span class="mono composer__tokens" id="tok"></span>
          <button class="sendbtn sendbtn--stop" id="stop-btn" type="button" aria-label="Stop" hidden>
            <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2.5"/></svg>
          </button>
          <button class="sendbtn sendbtn--go" id="send-btn" type="button" aria-label="Send message" disabled>
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- Settings: interior lives in ui/interior/settings.html, loaded lazily by main.ts -->
  <section class="view view--settings" id="settings-view" hidden></section>

  <!-- Sessions drawer -->
  <div class="overlay" id="drawer-overlay" hidden>
    <button class="overlay__scrim" id="drawer-scrim" type="button" aria-label="Close sessions"></button>
    <aside class="drawer" id="drawer" aria-label="Sessions">
      <div class="drawer__head">
        <span>Sessions</span>
        <button class="ibtn" id="drawer-close" type="button" aria-label="Close sessions">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="drawer__sub">
        <span class="cap">Recent</span>
        <button class="ibtn" id="sessions-prune" type="button" aria-label="Prune old sessions" title="Prune sessions (archive/delete per retention policy)">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        </button>
        <button class="ibtn" id="new-session" type="button" aria-label="New session">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <div class="drawer__search">
        <input id="sessions-search" type="search" placeholder="Search sessions…" aria-label="Search sessions and messages" autocomplete="off" spellcheck="false" />
      </div>
      <nav class="drawer__list" id="sessions" aria-label="Session list"></nav>
    </aside>
  </div>

  <!-- Model sheet -->
  <div class="overlay" id="sheet-overlay" hidden>
    <button class="overlay__scrim" id="sheet-scrim" type="button" aria-label="Close model picker"></button>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Choose model">
      <div class="sheet__grab" aria-hidden="true"></div>
      <div class="sheet__head">
        <input class="inp" id="model-filter" type="text" placeholder="Filter models…" aria-label="Filter models" autocomplete="off" spellcheck="false" />
      </div>
      <div class="sheet__list" id="model-list"></div>
      <div class="sheet__foot">
        <button class="sheet__add" id="sheet-add-provider" type="button">
          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          Add provider…
        </button>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="overlay" id="modal-overlay" hidden>
    <button class="overlay__scrim" id="modal-scrim" type="button" aria-label="Close dialog"></button>
    <div class="modal" id="modal" role="dialog" aria-modal="true">
      <div class="modal__head"><h2 id="modal-title"></h2></div>
      <div class="modal__body" id="modal-body"></div>
      <div class="modal__foot" id="modal-foot"></div>
    </div>
  </div>

  <!-- Toasts -->
  <div class="toasts" id="toasts" aria-live="polite"></div>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
