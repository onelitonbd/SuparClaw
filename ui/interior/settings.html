<!-- Settings interior: a dedicated control surface, loaded lazily by main.ts. -->
<div class="settings">
  <div class="settings__topbar">
    <button class="ibtn settings__menu-btn" id="settings-menu" type="button" aria-label="Settings menu" aria-expanded="false" aria-controls="settings-sidebar">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <span class="settings__topbar-brand">Settings</span>
    <button class="settings__back" id="settings-back" type="button">
      <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Back to app
    </button>
  </div>
  <div class="settings__panes">
    <aside class="settings__sidebar" id="settings-sidebar" aria-label="Settings navigation">
      <div class="settings__brand">
        <span class="settings__brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 5c0 6 2.1 9.4 6.2 12.1M16 3v11.5c0 5.6 2.1 9.2 6.8 12.5M23 5c0 5-1.4 8.2-4.1 10.7M10.2 26.5c1.9-1.7 3.9-2.6 6-2.6 2.2 0 4.3.9 6.2 2.6"/>
          </svg>
        </span>
        <span class="settings__brand-copy">
          <strong>SuparClaw</strong>
          <span>Gateway settings</span>
        </span>
      </div>
      <div class="settings__search">
        <svg class="settings__search-icon" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg>
        <input id="settings-search" type="search" placeholder="Search settings…" aria-label="Search settings" autocomplete="off" spellcheck="false" />
      </div>
      <nav class="settings__nav" id="settings-nav" aria-label="Settings sections"></nav>
      <div class="settings__sidebar-foot">
        <div class="settings__connection" id="settings-connection" data-state="connecting" role="status" aria-live="polite">
          <span class="settings__connection-dot" aria-hidden="true"></span>
          <span class="settings__connection-copy">
            <span class="settings__connection-caption">Gateway connection</span>
            <span class="settings__connection-label" id="settings-connection-label">Connecting…</span>
          </span>
        </div>
      </div>
    </aside>
    <button class="settings__scrim" id="settings-scrim" type="button" aria-label="Close settings menu" hidden></button>
    <main class="settings__main">
      <header class="settings__pagehead">
        <div class="settings__pagecopy">
          <div class="settings__context">
            <span>Settings</span>
            <svg aria-hidden="true" width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="m6 3 5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span id="settings-group">Chat</span>
          </div>
          <h1 id="settings-title" aria-describedby="settings-description">Defaults</h1>
          <p class="settings__description" id="settings-description">Choose a model and behavior for new agent runs.</p>
        </div>
      </header>
      <div class="settings__body" id="settings-body"></div>
    </main>
  </div>
</div>
