<!-- Settings interior: a takeover surface with its own app bar, section rail
     and content column. Loaded lazily into #settings-view from ui/src/main.ts
     so index.html stays light.

     Anatomy:
       .settings__topbar   app bar — mark, wordmark, live gateway readout, back
       .settings__panes    rail (search + sections) and content column
       .settings__pagehead section title + one-line description
       #settings-body      render root owned by ui/src/settings.ts -->
<div class="settings">
  <header class="settings__topbar">
    <button class="ibtn settings__menu-btn" id="settings-menu" type="button" aria-label="Settings menu" aria-expanded="false" aria-controls="settings-sidebar">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <span class="settings__mark" aria-hidden="true">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 1024 1024" fill="currentColor"><g transform="translate(539.03 556.16) scale(0.83531)"><g transform="rotate(-8 -80 0)"><g transform="rotate(-34 -330 40)"><rect x="-486" y="-160" width="300" height="330" rx="44" fill="currentColor"/></g><path d="M -330 -46 C -322 -156 -248 -240 -136 -286 C -26 -322 86 -306 150 -262 C 188 -228 178 -120 150 -14 C 120 76 60 130 -8 160 C -150 216 -284 186 -330 118 Z" fill="currentColor"/><path d="M 544 -222 C 334 -406 110 -330 -30 -206 L -8 -169 L 14 -132 C 344 -248 298 -212 544 -222 Z" fill="currentColor"/><path d="M 466 266 C 288 220 240 112 -42 0 L -59 80 L -76 160 C 66 280 286 340 466 266 Z" fill="currentColor"/></g></g></svg>
    </span>
    <span class="settings__wordmark">
      <span class="settings__wordmark-app">SuparClaw</span>
      <span class="settings__wordmark-tag">Settings</span>
    </span>
    <div class="settings__readout" id="settings-readout" aria-label="Gateway status"></div>
    <button class="settings__back" id="settings-back" type="button">
      <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      <span class="settings__back-label">Back to app</span>
    </button>
  </header>

  <div class="settings__panes">
    <aside class="settings__sidebar" id="settings-sidebar" aria-label="Settings">
      <div class="settings__drawer-head">
        <span class="settings__drawer-title">Settings</span>
        <button class="settings__drawer-close" id="settings-drawer-close" type="button" aria-label="Close settings menu">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="settings__search" role="search">
        <span class="settings__search-icon" aria-hidden="true">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        </span>
        <input id="settings-search" type="search" placeholder="Search settings" aria-label="Search settings" autocomplete="off" spellcheck="false" />
        <button class="settings__search-clear" id="settings-search-clear" type="button" aria-label="Clear search" hidden>
          <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <nav class="settings__nav" id="settings-nav" aria-label="Settings sections"></nav>
    </aside>

    <button class="settings__scrim" id="settings-scrim" type="button" aria-label="Close settings menu" hidden></button>

    <main class="settings__main">
      <div class="settings__pagehead">
        <h1 id="settings-title">Settings</h1>
        <p class="settings__desc" id="settings-desc" hidden></p>
      </div>
      <div class="settings__body" id="settings-body"></div>
    </main>
  </div>
</div>
